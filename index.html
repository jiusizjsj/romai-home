<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FAFAF9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E0E10" media="(prefers-color-scheme: dark)">
  <title></title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&display=swap">
  <style>
    :root {
      color-scheme: light dark;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --space-10: 40px;
      --space-12: 48px;
      --space-16: 64px;
      --space-24: 96px;
      --gutter: clamp(16px, 4vw, 48px);
      --section-gap: clamp(48px, 8vw, 96px);
      --content-max: 1120px;
      --reading-max: 68ch;
      --font-sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      --text-xs: 0.75rem;
      --text-sm: 0.875rem;
      --text-base: 1rem;
      --text-md: 1.125rem;
      --text-lg: 1.25rem;
      --text-2xl: clamp(1.75rem, 1.4rem + 1.2vw, 2.25rem);
      --text-4xl: clamp(2.5rem, 1.6rem + 3.2vw, 4rem);
      --leading-tight: 1.15;
      --leading-normal: 1.5;
      --leading-relaxed: 1.65;
      --tracking-display: -0.02em;
      --weight-regular: 400;
      --weight-medium: 500;
      --weight-semibold: 600;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-full: 9999px;
      --border-width: 1px;
      --duration-fast: 140ms;
      --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
      --z-sticky: 100;
      --bg: #FAFAF9;
      --surface: #FFFFFF;
      --surface-sunken: #F3F3F1;
      --border: #E3E3DF;
      --border-strong: #86867F;
      --text: #1A1A18;
      --text-muted: #55554F;
      --accent: #0F6E73;
      --accent-hover: #0B5A5E;
      --accent-fg: #FFFFFF;
      --accent-text: #0F6E73;
      --focus-ring: #0F6E73;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0E0E10;
        --surface: #161619;
        --surface-sunken: #1D1D21;
        --border: #2A2A30;
        --border-strong: #6E6E79;
        --text: #EDEDEF;
        --text-muted: #A3A3AD;
        --accent: #4FC7CC;
        --accent-hover: #7DDBDE;
        --accent-fg: #0E0E10;
        --accent-text: #4FC7CC;
        --focus-ring: #4FC7CC;
      }
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; background: var(--bg); color: var(--text); }

    body {
      font-family: var(--font-sans);
      font-size: var(--text-base);
      font-weight: var(--weight-regular);
      line-height: var(--leading-normal);
      text-rendering: optimizeLegibility;
    }

    :focus { outline: none; }
    :focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }

    .skip {
      position: absolute;
      left: var(--space-4);
      top: var(--space-4);
      transform: translateY(-160%);
      background: var(--accent);
      color: var(--accent-fg);
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-sm);
      text-decoration: none;
      z-index: 10;
    }
    .skip:focus { transform: none; }

    .wrap {
      width: min(var(--content-max), 100%);
      margin: 0 auto;
      padding-left: var(--gutter);
      padding-right: var(--gutter);
    }

    header {
      position: sticky;
      top: 0;
      z-index: var(--z-sticky);
      background: var(--bg);
      border-bottom: var(--border-width) solid var(--border);
      padding-top: env(safe-area-inset-top);
    }

    .bar {
      min-height: 64px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3) var(--space-4);
      padding-top: var(--space-2);
      padding-bottom: var(--space-2);
    }

    .brand {
      color: var(--text);
      font-size: var(--text-md);
      font-weight: var(--weight-semibold);
      letter-spacing: -0.01em;
      text-decoration: none;
    }

    .site-nav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-2) var(--space-5);
    }

    .site-nav a {
      color: var(--text);
      font-size: var(--text-sm);
      font-weight: var(--weight-medium);
      text-decoration: none;
    }

    .site-nav a:hover { text-decoration: underline; text-underline-offset: 4px; }

    .account {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-2);
      margin-left: auto;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 var(--space-4);
      border: var(--border-width) solid transparent;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: var(--text-sm);
      font-weight: var(--weight-medium);
      line-height: 1;
      text-decoration: none;
      cursor: pointer;
      transition: background-color var(--duration-fast) var(--ease-out), border-color var(--duration-fast) var(--ease-out);
    }

    .btn:hover { text-decoration: none; }
    .btn:active { transform: translateY(1px); }

    .btn-primary { background: var(--accent); color: var(--accent-fg); }
    .btn-primary:hover { background: var(--accent-hover); }

    .btn-secondary {
      background: var(--surface);
      border-color: var(--border-strong);
    }
    .btn-secondary:hover { background: var(--surface-sunken); }

    main { padding-bottom: var(--space-16); }

    .hero { padding-top: var(--space-16); }

    h1, h2, h3 {
      text-wrap: balance;
      letter-spacing: var(--tracking-display);
      line-height: var(--leading-tight);
      font-weight: var(--weight-semibold);
    }

    h1 {
      margin: 0;
      max-width: 12em;
      font-size: var(--text-4xl);
    }

    h2 {
      margin: 0 0 var(--space-6);
      font-size: var(--text-2xl);
      letter-spacing: -0.01em;
    }

    h3 { margin: 0; font-size: var(--text-lg); letter-spacing: -0.01em; }

    p { text-wrap: pretty; margin: 0; }

    .lede {
      max-width: var(--reading-max);
      margin-top: var(--space-6);
      font-size: var(--text-md);
      line-height: var(--leading-relaxed);
    }

    .endpoint {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-3) var(--space-4);
      max-width: 100%;
      margin-top: var(--space-8);
      padding: var(--space-4);
      background: var(--surface-sunken);
      border-radius: var(--radius-md);
    }

    .method, .url, pre, .code-label {
      font-family: var(--font-mono);
    }

    .method {
      flex: none;
      font-size: var(--text-sm);
      line-height: 1.4;
      color: var(--text-muted);
    }

    .url {
      min-width: 0;
      flex: 1 1 16rem;
      font-size: clamp(1.05rem, 0.85rem + 1vw, 1.75rem);
      font-weight: var(--weight-medium);
      line-height: 1.35;
      letter-spacing: -0.02em;
      overflow-wrap: anywhere;
    }

    .block { padding-top: var(--section-gap); }
    #models, #access { scroll-margin-top: 88px; }

    .note {
      max-width: var(--reading-max);
      margin: calc(var(--space-2) * -1) 0 var(--space-6);
      color: var(--text-muted);
      font-size: var(--text-sm);
      line-height: var(--leading-relaxed);
    }

    .models {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .models li {
      display: grid;
      grid-template-columns: minmax(7rem, 0.7fr) minmax(7rem, 0.7fr) minmax(0, 1.2fr);
      gap: var(--space-2) var(--space-6);
      align-items: baseline;
      padding: var(--space-4) 0;
      border-top: var(--border-width) solid var(--border);
    }

    .models li:last-child { border-bottom: var(--border-width) solid var(--border); }

    .vendor, .tags {
      margin: 0;
      color: var(--text-muted);
      font-size: var(--text-sm);
      line-height: var(--leading-relaxed);
    }

    .tags { display: flex; flex-wrap: wrap; gap: var(--space-2); }

    .tag {
      padding: var(--space-1) var(--space-2);
      border: var(--border-width) solid var(--border);
      border-radius: var(--radius-full);
      color: var(--text-muted);
      font-size: var(--text-xs);
      line-height: 1.4;
    }

    .facts {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--space-8) var(--space-6);
    }

    .facts h2 {
      margin: 0;
      font-size: var(--text-lg);
    }

    .facts p {
      max-width: 28em;
      margin-top: var(--space-2);
      line-height: var(--leading-relaxed);
    }

    .access {
      display: grid;
      grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr);
      gap: var(--space-8);
      align-items: start;
    }

    .steps {
      margin: 0;
      padding: 0 0 0 1.25rem;
      display: grid;
      gap: var(--space-4);
    }

    .steps li { padding-left: var(--space-2); line-height: var(--leading-relaxed); }
    .steps a { color: var(--accent-text); }
    .steps a:hover { text-underline-offset: 3px; }

    code.addr {
      font-family: var(--font-mono);
      font-size: 0.92em;
      overflow-wrap: anywhere;
    }

    .code {
      background: var(--surface-sunken);
      border-radius: var(--radius-md);
      min-width: 0;
    }

    .code-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-2) 0 var(--space-4);
    }

    .code-label {
      font-size: var(--text-sm);
      color: var(--text-muted);
    }

    pre {
      margin: 0;
      padding: var(--space-3) var(--space-4) var(--space-4);
      overflow-x: auto;
      font-size: var(--text-sm);
      line-height: 1.65;
      white-space: pre;
    }

    footer {
      border-top: var(--border-width) solid var(--border);
      padding: var(--space-6) 0 calc(var(--space-6) + env(safe-area-inset-bottom));
    }

    .foot {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
    }

    .copyline {
      margin: 0;
      color: var(--text-muted);
      font-size: var(--text-sm);
    }

    .foot nav { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-5); }
    .foot a { color: var(--accent-text); font-size: var(--text-sm); font-weight: var(--weight-medium); }

    @media (max-width: 800px) {
      .facts, .access { grid-template-columns: 1fr; }
      .models li { grid-template-columns: 1fr; gap: var(--space-1); }
      .hero { padding-top: var(--space-10); }
    }

    @media (prefers-reduced-motion: reduce) {
      .btn { transition: none; }
      .btn:active { transform: none; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    const SITE = {
      name: "Romai",
      apiOrigin: "https://myromai.com",
      apiBase: "https://myromai.com/v1",
      docUrl: "",
      contact: "",
      login: "https://myromai.com/login",
      register: "https://myromai.com/register",
      console: "https://myromai.com/dashboard",
      plaza: "https://myromai.com/model-plaza",
      models: [
        { name: "Claude", vendor: "Anthropic", tags: ["文本", "视觉", "工具"] },
        { name: "GPT", vendor: "OpenAI", tags: ["文本", "视觉", "工具"] },
        { name: "Gemini", vendor: "Google", tags: ["文本", "视觉", "长上下文"] },
        { name: "更多模型", vendor: "以控制台为准", tags: ["按接入情况显示"] }
      ]
    };

    const endpointPath = SITE.apiBase + "/chat/completions";
    const endpointCopy = "POST " + endpointPath;
    const codeText = [
      "from openai import OpenAI",
      "",
      "client = OpenAI(",
      '    base_url="' + SITE.apiBase + '",',
      '    api_key="控制台创建的密钥"',
      ")",
      "reply = client.chat.completions.create(",
      '    model="控制台中的模型名",',
      '    messages=[{"role": "user", "content": "你好"}]',
      ")"
    ].join("\n");

    const esc = (value) => String(value).replace(/[&<>"']/g, (ch) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[ch]);

    document.title = SITE.name;
    const description = document.createElement("meta");
    description.name = "description";
    description.content = "已接入的 Claude、GPT、Gemini 等模型，用同一把密钥、同一个地址调用。按用量计费。";
    document.head.appendChild(description);

    const link = (href, label, className) =>
      '<a href="' + esc(href) + '"' + (className ? ' class="' + className + '"' : "") + ">" + label + "</a>";

    const doc = SITE.docUrl
      ? '<a href="' + esc(SITE.docUrl) + '" target="_blank" rel="noopener noreferrer">文档<span class="sr">（新窗口）</span></a>'
      : "";
    const contact = SITE.contact
      ? link("mailto:" + SITE.contact, "联系")
      : "";

    const rows = SITE.models.map((model) =>
      "<li><h3>" + esc(model.name) + "</h3><p class=\"vendor\">" + esc(model.vendor) +
      "</p><p class=\"tags\">" + model.tags.map((tag) => "<span class=\"tag\">" + esc(tag) + "</span>").join("") +
      "</p></li>"
    ).join("");

    document.getElementById("app").innerHTML =
      '<a class="skip" href="#main">跳到内容</a>' +
      "<header><div class=\"wrap bar\">" +
        link(SITE.apiOrigin, esc(SITE.name), "brand") +
        '<nav class="site-nav" aria-label="页面">' +
          '<a href="#models">模型</a><a href="#access">接入</a>' + doc +
        "</nav>" +
        '<div class="account">' +
          link(SITE.login, "登录", "btn") +
          link(SITE.console, "进入控制台", "btn btn-primary") +
        "</div>" +
      "</div></header>" +
      '<main id="main">' +
        '<section class="hero"><div class="wrap">' +
          "<h1>一个密钥，<br>调用多个模型</h1>" +
          '<div class="endpoint">' +
            '<span class="method">POST</span>' +
            '<code class="url">' + esc(endpointPath) + "</code>" +
            '<button class="btn btn-secondary" type="button" data-copy="endpoint">复制</button>' +
          "</div>" +
          '<p class="lede">已接入的 Claude、GPT、Gemini 等模型，用同一把密钥、同一个地址调用。按用量计费。</p>' +
        "</div></section>" +
        '<section class="block" id="models"><div class="wrap">' +
          "<h2>模型</h2>" +
          '<p class="note">能力与价格以控制台列表为准。</p>' +
          '<ul class="models">' + rows + "</ul>" +
        "</div></section>" +
        '<section class="block"><div class="wrap facts">' +
          "<div><h2>一键接入</h2><p>一把密钥调用已接入模型，客户端只改地址和密钥。</p></div>" +
          "<div><h2>调度与会话</h2><p>多个上游账号分担请求，会话尽量落在同一上游。</p></div>" +
          "<div><h2>按量与配额</h2><p>按使用量计费，可查看明细，也可给密钥设置上限。</p></div>" +
        "</div></section>" +
        '<section class="block" id="access"><div class="wrap">' +
          "<h2>替换地址即可</h2>" +
          '<div class="access">' +
            "<ol class=\"steps\">" +
              "<li>" + link(SITE.register, "注册账号") + "</li>" +
              "<li>在" + link(SITE.console, "控制台") + "创建密钥</li>" +
              "<li>在原来的 OpenAI SDK 里把 base_url 换成 <code class=\"addr\">" + esc(SITE.apiBase) + "</code></li>" +
            "</ol>" +
            '<div class="code">' +
              '<div class="code-bar"><span class="code-label">Python</span>' +
              '<button class="btn btn-secondary" type="button" data-copy="code">复制</button></div>' +
              "<pre>" + esc(codeText) + "</pre>" +
            "</div>" +
          "</div>" +
        "</div></section>" +
      "</main>" +
      "<footer><div class=\"wrap foot\">" +
        '<p class="copyline">© ' + new Date().getFullYear() + " " + esc(SITE.name) + "</p>" +
        "<nav>" + doc + link(SITE.plaza, "模型广场") + contact + "</nav>" +
      "</div></footer>";

    const style = document.createElement("style");
    style.textContent = ".sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}";
    document.head.appendChild(style);

    const copies = { endpoint: endpointCopy, code: codeText };
    let timer = 0;
    let current = null;
    document.getElementById("app").addEventListener("click", async (event) => {
      const button = event.target.closest("[data-copy]");
      if (!button) return;
      const text = copies[button.getAttribute("data-copy")];
      let ok = false;
      try {
        await navigator.clipboard.writeText(text);
        ok = true;
      } catch {
        const area = document.createElement("textarea");
        area.value = text;
        area.style.position = "fixed";
        area.style.left = "-9999px";
        document.body.appendChild(area);
        area.select();
        ok = document.execCommand("copy");
        area.remove();
      }
      if (!ok) return;
      if (current && current !== button) current.textContent = "复制";
      current = button;
      button.textContent = "已复制";
      clearTimeout(timer);
      timer = setTimeout(() => {
        button.textContent = "复制";
        if (current === button) current = null;
      }, 1600);
    });
  </script>
</body>
</html>
